# Shared sub-flow: sign in with the mock backend's demo credentials and wait for Home.
# Needs a build with EXPO_PUBLIC_API_MOCKS=true (the committed .env default).
appId: ${APP_ID || 'com.example.starterapp.dev'}
---
- tapOn:
    id: 'sign-in-email'
- inputText: 'demo@example.com'
- tapOn:
    id: 'sign-in-password'
- inputText: 'password'
# The keyboard can cover the submit button on small screens.
- hideKeyboard
- tapOn:
    id: 'sign-in-submit'
# iOS offers to save the password to iCloud Keychain; its sheet covers Home and the tab bar.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: 'Not Now'
          timeout: 5000
          optional: true
      - tapOn:
          text: 'Not Now'
          optional: true
- extendedWaitUntil:
    visible:
      id: 'home-title'
    timeout: 10000
