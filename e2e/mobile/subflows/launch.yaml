# Shared sub-flow: cold-start the app with a clean state and wait for the sign-in screen.
# Reuse with:  - runFlow: ../subflows/launch.yaml
appId: ${APP_ID || 'com.example.starterapp.dev'}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'sign-in-title'
    timeout: 20000
