# REQ: app-init — a signed-in user switches between Home and Settings and signs out.
appId: ${APP_ID || 'com.example.starterapp.dev'}
tags:
  - smoke
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/sign-in.yaml
- tapOn: 'Settings'
- extendedWaitUntil:
    visible:
      id: 'settings-title'
    timeout: 10000
- tapOn: 'Home'
- assertVisible:
    id: 'home-title'
- tapOn: 'Settings'
- tapOn:
    id: 'settings-sign-out'
- extendedWaitUntil:
    visible:
      id: 'sign-in-title'
    timeout: 10000
